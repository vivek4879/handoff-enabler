name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://handoff:handoff@localhost:5432/handoff_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handoff
          POSTGRES_PASSWORD: handoff
          POSTGRES_DB: handoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff -d handoff_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to the test database
        run: pnpm --filter api db:migrate:test

      - name: Test
        run: pnpm test
